services:
    server:
        build:
            context: .
            dockerfile: Dockerfile.server
        container_name: asg_server

        env_file:
            - apps/server/.env
        environment:
            DATABASE_PATH: /usr/src/app/data/orders.db
        volumes:
            # * SQLite lives here; the dir must be writable by uid 1001
            - ./data:/usr/src/app/data
        ports:
            - "3000:3000"
        restart: unless-stopped
